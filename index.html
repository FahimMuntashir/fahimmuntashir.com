<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSU Advising Course List</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>NSU Advising Course List</h1>
    <div class="search">
      <input type="text" id="searchCourse" placeholder="Course">
      <input type="text" id="searchFaculty" placeholder="Faculty">
    </div>
    <table>
      <thead>
        <tr>
          <th>Course</th>
          <th>Section</th>
          <th>Faculty</th>
          <th>Time</th>
          <th>Room</th>
          <th>Semester</th>
        </tr>
      </thead>
      <tbody id="courseTable">
        <!-- Dynamic data will be inserted here -->
      </tbody>
    </table>
    <!-- <div id="pagination"></div> -->

  </div>
  <script src="js/script.js"></script>
</body>
</html>
